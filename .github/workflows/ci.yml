name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_dev_password
          POSTGRES_DB: chatbot_integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d chatbot_integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://ci:ci_dev_password@localhost:5432/chatbot_integration
      REDIS_URL: redis://localhost:6379
      APP_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BETTER_AUTH_SECRET: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_API_URL: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:5173
      WEBHOOK_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      # MinIO needs a server command, which GitHub service containers cannot override,
      # so it runs as a step instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 2
          done
          docker run --rm --network host --entrypoint /bin/sh quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin && \
             mc mb --ignore-existing local/media"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      # The console must be built before the tests: the routing contract asserts that the
      # API serves it, which it cannot do without the assets.
      - run: bun run build:web
      - run: bun run build:widget
      - run: bun run test

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_dev_password
          POSTGRES_DB: chatbot_integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d chatbot_integration"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://ci:ci_dev_password@localhost:5432/chatbot_integration
      REDIS_URL: redis://localhost:6379
      APP_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BETTER_AUTH_SECRET: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
      BETTER_AUTH_URL: http://localhost:3000
      # Filesystem storage: the browser tests do not exercise object storage, and this
      # keeps the job to two services.
      S3_ENDPOINT: file://./.data/media
      S3_REGION: us-east-1
      S3_BUCKET: media
      S3_ACCESS_KEY_ID: unused
      S3_SECRET_ACCESS_KEY: unused
      S3_PUBLIC_URL: /api/v1/uploads
      PUBLIC_API_URL: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:5173
      WEBHOOK_BASE_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: changeme12345
      CI: "true"

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:seed
      # The browser tests embed the widget, which the API serves from disk.
      - run: bun run build:widget
      - run: bunx playwright install chromium --with-deps
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7

  images:
    name: release images
    runs-on: ubuntu-latest
    # What is deployed is the images, not the source tree: build both exactly as production
    # does, start the stack, and require both services to report healthy.
    steps:
      - uses: actions/checkout@v5
      - name: Write an environment for the stack
        run: |
          cat > .env <<'ENV'
          NODE_ENV=production
          POSTGRES_PASSWORD=ci_images_password
          DATABASE_URL=postgres://ci:ci_images_password@postgres:5432/chatbot_integration
          REDIS_URL=redis://redis:6379
          APP_SECRET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BETTER_AUTH_SECRET=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
          BETTER_AUTH_URL=http://localhost:3000
          S3_ENDPOINT=http://minio:9000
          S3_REGION=us-east-1
          S3_BUCKET=media
          S3_ACCESS_KEY_ID=minioadmin
          S3_SECRET_ACCESS_KEY=minioadmin
          S3_FORCE_PATH_STYLE=true
          PUBLIC_API_URL=http://localhost:3000
          PUBLIC_WEB_URL=http://localhost:3000
          WEBHOOK_BASE_URL=http://localhost:3000
          ENV
      - run: docker compose -f docker-compose.yml build api worker
      - run: docker compose -f docker-compose.yml up -d
      - name: Both services come up healthy
        run: |
          for i in $(seq 1 60); do
            api=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose -f docker-compose.yml ps -q api) 2>/dev/null || true)
            worker=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose -f docker-compose.yml ps -q worker) 2>/dev/null || true)
            echo "api=$api worker=$worker"
            if [ "$api" = healthy ] && [ "$worker" = healthy ]; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.yml logs --tail 200
          exit 1
      - if: always()
        run: docker compose -f docker-compose.yml down -v

